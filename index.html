<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Álbum ❤️</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- VIDEO DE INICIO -->
<div id="videoInicio" style="display:block;">
  <video id="video" autoplay muted loop>
    <source src="video-intro.mp4" type="video/mp4">
  </video>
</div>

<!-- CONTENIDO PRINCIPAL: HEADER, MENÚ, GALERÍA -->
<div id="mainContent" style="display:none;">
  <div class="background"></div>

  <!-- HEADER -->
  <header>
    <h1>Nuestros Recuerdos ❤️</h1>
    <p class="subtitulo">Felices 20 Núria</p>
  </header>

  <!-- MENÚ DE SUBAPARTADOS -->
  <nav id="menu"></nav>

  <!-- GALERÍA DE FOTOS -->
  <div id="galeria" class="galeria"></div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
    <span id="cerrar">&times;</span>
    <img id="imagenGrande">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
