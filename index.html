<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestro Álbum ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===== PORTADA WOW ESTILO NETFLIX ===== -->

<div id="introPantalla">

  <div class="intro-overlay"></div>

  <div class="intro-content">

    <h1>NUNCA PODRÍA HACERLO ❤️</h1>

    <p>Espero que te guste</p>

    <button id="entrarBtn">Descúbrelo</button>

  </div>

</div>

<!-- ===== CONTENIDO PRINCIPAL ===== -->

<div id="mainContent">

  <!-- FONDO ROMÁNTICO -->

  <div class="background"></div>

  <!-- HEADER -->

  <header>

    <h1>NUESTROS RECUERDOS ❤️</h1>

    <p class="subtitulo">Felices 20 Núria</p>

  </header>

  <!-- MENÚ -->

  <nav id="menu"></nav>

  <!-- CONTENIDO -->

  <div id="contenidoPrincipal">

    <!-- GALERÍA -->

    <div id="galeria" class="galeria"></div>

    <!-- VIDEO INICIO -->

    <div id="videoInicio" style="display:none;">

      <video id="video" autoplay muted loop>

        <source src="video-intro.mp4" type="video/mp4">

      </video>

    </div>

  </div>

  <!-- LIGHTBOX -->

  <div id="lightbox" class="lightbox">

    <span id="cerrar">&times;</span>

    <img id="imagenGrande">

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
